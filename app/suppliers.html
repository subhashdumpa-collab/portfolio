<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplier approval · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/suite.css">
<style>
/* Suppliers module. Brand colour comes from the shell (--suite-accent...); status colours are fixed. */
:root{
  --acc:var(--suite-accent);--acc-strong:var(--suite-accent-strong);--acc-ink:var(--suite-accent-ink);--acc-tint:var(--suite-accent-tint);--acc-line:var(--suite-accent-line);
  --ink:var(--suite-ink);--page:var(--suite-page);--card:var(--suite-surface);--line:var(--suite-line);--field:var(--suite-line-2);--sunk:var(--suite-sunk);
  --body:var(--suite-body);--label:var(--suite-label);--faint:#8A919C;--th:#1F2430;--row-hover:#F8F9FB;
  --good:#1F7A4D;--good-tint:#E6F3EC;--good-line:#BFDDCD;--warn:#8A5D0C;--warn-tint:#FBF0DC;--warn-line:#EBD6AC;
  --bad:#B23A2E;--bad-tint:#F8E7E4;--bad-line:#EFC9C3;--info:#1F4E8C;--info-tint:#E4EEFA;--info-line:#BBD2EF;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --faint:#7C8490;--th:#2A2E35;--row-hover:#22252A;
  --good:#6CC59A;--good-tint:#173126;--good-line:#2A5440;--warn:#E9B65C;--warn-tint:#33270F;--warn-line:#5A4519;
  --bad:#F08A7E;--bad-tint:#3A1B18;--bad-line:#5E2C27;--info:#86B4EE;--info-tint:#17263A;--info-line:#2B4366;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:14.5px/1.45 var(--suite-font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc-ink)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 64px;display:grid;gap:14px}
@media (min-width:1100px){html.suite-on body.try-open{padding-right:360px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:18px 20px}
h1{font-size:24px;font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;margin:0 0 8px;letter-spacing:-.005em}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
p{margin:0 0 10px;max-width:74ch}
.muted{color:var(--body)}.small{font-size:13px}.lblc{color:var(--label)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink)}
.btn{border:1px solid var(--field);background:var(--card);padding:7px 13px;border-radius:7px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--suite-on-accent)}
.btn.pri:hover{background:var(--acc-strong)}
.btn.good{border-color:var(--good-line);color:var(--good)}
.btn.bad{border-color:var(--bad-line);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.link{border:0;background:none;padding:0;color:var(--acc-ink);white-space:normal;text-align:left}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
.field{display:grid;gap:4px;align-content:start}
.field label,.lbl{font-size:13px;font-weight:600}
.field small{font-size:12px;color:var(--label)}
input[type=text],input[type=email],input[type=tel],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid var(--field);border-radius:7px;padding:8px 10px;background:var(--card);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.err{border-color:var(--bad)!important;background:var(--bad-tint)!important}
.note{border:1px solid;border-radius:8px;padding:10px 12px;font-size:13.5px}
.note b{display:block}
.note.info{background:var(--info-tint);border-color:var(--info-line);color:var(--info)}
.note.good{background:var(--good-tint);border-color:var(--good-line);color:var(--good)}
.note.warn{background:var(--warn-tint);border-color:var(--warn-line);color:var(--warn)}
.note.bad{background:var(--bad-tint);border-color:var(--bad-line);color:var(--bad)}
.note.grey{background:var(--sunk);border-color:var(--line);color:var(--body)}
.note span,.note li,.note p{color:var(--ink)}
.note ul{margin:4px 0 0;padding-left:18px}
.tw{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-grey{color:var(--label);background:var(--sunk);border-color:var(--line)}
.p-info{color:var(--info);background:var(--info-tint);border-color:var(--info-line)}
.p-warn{color:var(--warn);background:var(--warn-tint);border-color:var(--warn-line)}
.p-good{color:var(--good);background:var(--good-tint);border-color:var(--good-line)}
.p-bad{color:var(--bad);background:var(--bad-tint);border-color:var(--bad-line)}
.id{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}.na{color:var(--faint)}

/* header card */
.hd{border-top:3px solid var(--acc)}
.hrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;padding:14px 18px 0}
.desc{font-size:13px;color:var(--body);margin:3px 0 0}
.desc b{color:var(--ink)}
.who{margin:12px 18px 0;padding:8px 12px;border-radius:8px;background:var(--acc-tint);border:1px solid var(--acc-line);display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:13px}
.who .me{font-weight:600}
.who .seg{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.who .seg button{border:1px solid var(--acc-line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.who .seg button.on{background:var(--acc);border-color:var(--acc);color:var(--suite-on-accent)}
.tabs{display:flex;gap:2px;margin-top:10px;padding:0 10px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--body);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.tab .n{font-family:var(--mono);font-size:11px;background:var(--sunk);border-radius:4px;padding:1px 6px;color:var(--label)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.intro{font-size:13px;color:var(--body);padding:10px 18px;border-bottom:1px solid var(--line)}

/* overview */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.stat{padding:14px 18px;border:0;border-right:1px solid var(--line);text-align:left;background:none;display:flex;flex-direction:column;justify-content:flex-start;gap:2px}
.stat:last-child{border-right:0}
.stat:hover{background:var(--row-hover)}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--label)}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.good b{color:var(--good)}
.ovgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;padding:14px 18px 18px;border-top:1px solid var(--line)}
.box{border:1px solid var(--line);border-radius:9px;padding:14px 16px;min-width:0}
.box h3{display:flex;gap:8px;align-items:center}
.cnt{font-family:var(--mono);font-size:11px;background:var(--warn-tint);color:var(--warn);border-radius:10px;padding:1px 7px}
.need{border-top:1px solid var(--line);padding:9px 0}
.need:first-of-type{border-top:0}
.need .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.need .k.bad{color:var(--bad)}.need .k.warn{color:var(--warn)}.need .k.info{color:var(--info)}.need .k.acc{color:var(--acc-ink)}
.need .k span{color:var(--ink);letter-spacing:0;text-transform:none;font-weight:600;font-size:12.5px}
.need ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.need li button{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 6px;border-radius:5px;border:0;background:none;width:100%;text-align:left}
.need li button:hover{background:var(--row-hover)}
.need li em{font-style:normal;color:var(--label);font-size:12.5px;white-space:nowrap}
.hbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex;margin:6px 0 10px}
.hbar i{display:block;height:100%}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;justify-content:space-between}
.legend s{text-decoration:none;display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;counter-reset:f}
.flow li{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--card);font-size:13px;counter-increment:f;color:var(--body)}
.flow li::before{content:counter(f);font-family:var(--mono);font-size:11px;font-weight:600;color:var(--acc-ink);display:block;margin-bottom:4px}
.flow li b{display:block;font-size:14px;margin-bottom:2px;color:var(--ink)}
.flow li.s{border-color:var(--acc-line);background:var(--acc-tint)}

/* register */
.filters{padding:12px 18px;display:grid;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flbl{width:74px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--label);text-transform:uppercase}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--label)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip.on i{color:var(--card)}
.chip.c-bad{background:var(--bad-tint);border-color:var(--bad-line);color:var(--bad)}
.chip.c-warn{background:var(--warn-tint);border-color:var(--warn-line);color:var(--warn)}
.chip.c-bad i,.chip.c-warn i{color:inherit}
.chip.c-bad.on,.chip.c-warn.on{outline:2px solid currentColor;outline-offset:-2px}
.search{margin-left:auto;flex:0 1 280px;min-width:160px}
.search input{padding:6px 10px;font-size:13px}
table.reg{border-collapse:collapse;width:100%;min-width:940px}
table.reg th{background:var(--th);color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;text-align:left;padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none}
table.reg th .ar{opacity:.55;margin-left:4px}
table.reg th.sorted .ar{opacity:1}
table.reg td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px;font-variant-numeric:tabular-nums}
table.reg tbody tr.r{cursor:pointer}
table.reg tbody tr.r:hover{background:var(--row-hover)}
.nm{font-weight:600;min-width:210px}
.sub{display:block;font-size:12px;color:var(--label);font-weight:400}
.sub.bad{color:var(--bad);font-weight:600}.sub.warn{color:var(--warn);font-weight:600}
.ds{white-space:nowrap}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 18px;font-size:12px;color:var(--label)}
.empty{padding:20px 18px;color:var(--label)}

/* approved list */
.catg{padding:14px 18px;border-top:1px solid var(--line)}
.catg h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--label);margin-bottom:8px}
.apgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ap{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--card);text-align:left;display:grid;gap:4px}
.ap:hover{border-color:var(--acc-line);background:var(--row-hover)}
.ap b{font-size:14.5px}
.ap .l{font-size:12.5px;color:var(--body)}

/* invitations */
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:8px;background:var(--card)}
.item .top{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:11.5px}
.steps span{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--faint)}
.steps span.done{color:var(--good);border-color:var(--good-line);background:var(--good-tint)}
.steps span.now{color:var(--acc-ink);border-color:var(--acc-line);background:var(--acc-tint)}
.ev{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:5px}
.ev li{display:flex;gap:10px;min-width:0}
.ev li>span{min-width:0;overflow-wrap:anywhere}
.ev time{font-family:var(--mono);font-size:11.5px;color:var(--label);white-space:nowrap;padding-top:1px}
.ev small{color:var(--label)}

/* detail */
.back{font-size:13px;font-weight:600;color:var(--acc-ink);border:0;background:none;padding:0}
.dhead{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tagq{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.sec h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--label);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kv{background:var(--sunk);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:7px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--label)}.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kv dd.nr{font-weight:400;color:var(--faint);font-style:italic}
.kv dd small{display:block;font-weight:400;color:var(--body)}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{color:var(--label);font-size:11px;padding:6px;border-bottom:1px solid var(--line);text-align:left;text-transform:uppercase;letter-spacing:.05em}
.mini td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.mini tr:last-child td{border-bottom:0}
.icard{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.rsteps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rsteps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.rsteps .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--field);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono)}
.rsteps li.done .n{background:var(--good);border-color:var(--good);color:#fff}
.rsteps li.now .n{border-color:var(--acc);color:var(--acc-ink);background:var(--acc-tint)}
.rsteps li.fail .n{background:var(--bad);border-color:var(--bad);color:#fff}
.rsteps b{display:block}
.rsteps .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.layers{display:grid;gap:8px}
.layer{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--sunk)}
.layer b{display:block;font-size:13px;margin-bottom:2px}
.layer code{font-family:var(--mono);font-size:11.5px;word-break:break-all;color:var(--acc-ink)}
.fn{font-family:var(--mono);font-size:12px;word-break:break-all}
.hsmark{border-left:3px solid var(--acc);padding-left:12px}

/* supplier side */
.shell{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--page)}
.shead{background:var(--card);border-bottom:1px solid var(--line);border-top:3px solid var(--acc);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.slogo{font-weight:700;font-size:17px;color:var(--acc-ink);line-height:1.1}
.slogo span{font-size:13px;font-weight:600;color:var(--ink);margin-left:6px}
.sbody{padding:22px 18px}
.sbox{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
.inbox{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:360px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.inbox .ml{border-right:1px solid var(--line);background:var(--card)}
.inbox .ml button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px}
.inbox .ml button.on{background:var(--acc-tint)}
.inbox .ml b{display:block;font-size:13.5px}
.inbox .ml small{display:block;font-size:12px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail{padding:18px 20px;background:var(--card);min-width:0}
.mail .h{font-size:13px;color:var(--label);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;display:grid;gap:2px;overflow-wrap:anywhere}
.mail .h b{color:var(--ink)}
.code{display:flex;gap:8px}
.code input{width:46px;height:52px;text-align:center;font-family:var(--mono);font-size:22px;padding:0}
.bigcode{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.12em}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--acc);flex:none}
.fgrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.srail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;position:sticky;top:calc(var(--suite-bar-h) + 12px)}
.srail ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.srail button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;display:flex;gap:8px;align-items:center;font-size:13.5px}
.srail button.on{background:var(--acc-tint);font-weight:700}
.srail button:disabled{opacity:.45;cursor:not-allowed}
.srail .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--field);display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono);flex:none}
.srail .ok .n{background:var(--good);border-color:var(--good);color:#fff}
.srail .saved{font-size:12px;color:var(--good);margin-top:10px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.q{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:7px}
.q:first-child{border-top:0}
.qn{font-family:var(--mono);font-size:11.5px;color:var(--label);margin-right:6px}
.yn{display:flex;gap:6px;flex-wrap:wrap}
.yn button{border:1px solid var(--field);background:var(--card);border-radius:6px;padding:4px 13px;font-weight:600;font-size:13.5px}
.yn button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.cert{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:10px;margin-bottom:10px}
.cert .ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.up{border:1.5px dashed var(--field);border-radius:8px;padding:9px 12px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.up.has{border-style:solid;border-color:var(--good-line);background:var(--good-tint)}
.up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.up label{cursor:pointer;font-weight:600;color:var(--acc-ink)}
.msg{font-size:12.5px;font-weight:600}.msg.bad{color:var(--bad)}
.pfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}

<script>
(function () {
'use strict';
const Su = window.Suite, esc = Su.esc;
const VERSION = 1;
const STAFF = ['sm', 'ak', 'dm'];
const ROLE_NOTE = {
  sm: 'runs the register, sends invitations and recommends suppliers for approval',
  ak: 'checks the health and safety answers',
  dm: 'gives the final approval'
};
const CATS = ['Materials', 'Plant hire', 'PPE and workwear', 'Haulage', 'IT and software', 'Cleaning', 'Calibration', 'Training', 'Subcontractor', 'Professional services', 'Other'];
const INS = [['el', 'Employers’ liability'], ['pl', 'Public liability'], ['pi', 'Professional indemnity'], ['prod', 'Product liability']];
const INS_LBL = { el: 'Employers’ liability', pl: 'Public liability', pi: 'Professional indemnity', prod: 'Product liability' };
const ATYPES = { yn: 'Yes / No', yna: 'Yes / No / Not applicable', text: 'Short text', long: 'Long text', number: 'Number', date: 'Date', file: 'File upload', ynfile: 'Yes / No, with upload if Yes' };
const BUILTIN = {
  details: 'Fixed fields: what you supply, company name, trading address, telephone, main contact, position, description of goods or services, years trading, company number and VAT number.',
  insurance: 'Fixed fields: employers’, public, professional indemnity and product liability. Each has “We hold this” or “We don’t hold this”, the limit of cover, insurer, expiry date and certificate.',
  declaration: 'Fixed fields: declaration wording, full name, position and a tick box that acts as the signature.'
};
const FLOW = ['Invited', 'Opened', 'Signed in', 'Confirmed', 'In progress', 'Submitted', 'Decided'];
const PRIV_VERSION = 'Supplier privacy notice, sample v1';
const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

/* ---------- the questionnaire as first set up ---------- */
const q = (id, text, type, o) => { o = o || {}; return { id, text, type: type || 'yn', help: o.help || '', required: o.required !== false, status: 'active', types: o.types || [], follow: o.follow || '', flag: o.flag || '' }; };
const DEFAULT_FORM = { version: 1, changedAt: null, changedBy: 'As first set up', sections: [
  { id: 'details', code: 'C', title: 'Company details', intro: 'About your business and who we should contact.', builtin: 'details', questions: [] },
  { id: 'insurance', code: 'I', title: 'Insurance', intro: 'Tell us which policies you hold and add a copy of each current certificate.', builtin: 'insurance', questions: [] },
  { id: 'hs', code: 'H', title: 'Health and safety', intro: 'How you keep your own people, and ours, safe.', reviewer: 'ak', questions: [
    q('H1', 'Do you have a written health and safety policy that has been reviewed in the last 12 months?', 'yn', { flag: 'No' }),
    q('H2', 'Who gives you competent health and safety advice?', 'text', { help: 'A named person in your business, or an outside adviser.' }),
    q('H3', 'Do you write risk assessments for the kind of work you would do for us?', 'yn', { flag: 'No' }),
    q('H4', 'Do your people get health and safety training that suits their job, and do you keep records of it?', 'yn', { flag: 'No' }),
    q('H5', 'In the last three years, have you had a reportable injury, an enforcement notice or a prosecution?', 'yn', { flag: 'Yes', follow: 'Briefly, what happened and what did you change?' }),
    q('H6', 'Do you hold a health and safety certification, such as ISO 45001 or membership of a recognised safety scheme?', 'ynfile')
  ] },
  { id: 'quality', code: 'Q', title: 'Quality', intro: '', questions: [
    q('Q1', 'Do you check your goods or services against the order before they reach the customer?', 'yn', { flag: 'No' }),
    q('Q2', 'Do you hold ISO 9001 or another quality certification?', 'ynfile'),
    q('Q3', 'What do you do when a customer complains or a delivery is wrong?', 'long'),
    q('Q4', 'Can you trace materials or products back to where they came from, or to a batch?', 'yna'),
    q('Q5', 'Do you check the suppliers and subcontractors that you rely on?', 'yn')
  ] },
  { id: 'env', code: 'E', title: 'Environment', intro: '', questions: [
    q('E1', 'Do you have an environmental policy?', 'yn'),
    q('E2', 'Do you hold ISO 14001 or another environmental certification?', 'ynfile'),
    q('E3', 'Is your waste taken away by a registered waste carrier?', 'yna', { flag: 'No' }),
    q('E4', 'In the last three years, has an environmental regulator taken action against you?', 'yn', { flag: 'Yes', follow: 'Briefly, what happened and what did you change?' }),
    q('E5', 'What are you doing to use less energy or fuel, or to create less waste?', 'long', { required: false })
  ] },
  { id: 'data', code: 'D', title: 'Data protection', intro: 'Only as much as fits the work. If you will never see personal information, most answers are “Not applicable”.', questions: [
    q('D1', 'Will you see or hold personal information about our staff or our customers?', 'yn'),
    q('D2', 'Do you have a data protection policy and a named person who looks after it?', 'yna'),
    q('D3', 'If you need to be registered with the data protection regulator, are you?', 'yna'),
    q('D4', 'In the last three years, have you had a personal data breach that you had to report?', 'yn', { flag: 'Yes', follow: 'Briefly, what happened and what did you change?' })
  ] },
  { id: 'ethics', code: 'M', title: 'Modern slavery and ethics', intro: '', questions: [
    q('M1', 'Do you check that everyone who works for you has the right to work in the UK?', 'yn', { flag: 'No' }),
    q('M2', 'Is everyone who works for you paid at least the legal minimum wage?', 'yn', { flag: 'No' }),
    q('M3', 'Do you have a policy or statement on modern slavery that also covers your own suppliers?', 'yna'),
    q('M4', 'Do you have an anti-bribery policy that your staff have been told about?', 'yn', { flag: 'No' }),
    q('M5', 'Do you have an equality and diversity policy?', 'yn')
  ] },
  { id: 'refs', code: 'R', title: 'References', intro: 'Two customers we may contact. We will tell you before we do.', questions: [
    q('R1', 'First reference: company and contact name', 'text'),
    q('R2', 'First reference: email or phone', 'text'),
    q('R3', 'Second reference: company and contact name', 'text'),
    q('R4', 'Second reference: email or phone', 'text', { required: false }),
    q('R5', 'Roughly how long have you worked with these customers?', 'text', { required: false })
  ] },
  { id: 'decl', code: 'X', title: 'Declaration', intro: 'Please confirm your answers.', builtin: 'declaration', questions: [] }
] };
const SAMPLE = {
  H2: 'Our operations director, with an outside safety adviser on a retainer.',
  Q3: 'It is logged the same day and given to a named person. Wrong or faulty goods are replaced or credited within five working days.',
  E5: 'LED lighting in the yard, and deliveries are planned to cut empty running.',
  D1: 'No', D2: 'Yes', D3: 'Yes',
  R1: 'Castlebrook Homes, Dana Whitlow', R2: 'dana.whitlow@castlebrookhomes.example',
  R3: 'Fenmoor Estates, Lee Ansah', R4: '01632 960155', R5: 'Three years and six years'
};

/* ---------- small helpers ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
const pad = (n, w) => String(n).padStart(w, '0');
const todayISO = () => Su.iso(Su.today());
const dIso = n => Su.iso(Su.daysFromNow(n));
const dt = (n, t) => dIso(n) + 'T' + t;
const nowStamp = () => { const d = new Date(); return todayISO() + 'T' + pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2); };
const fmt = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
const fmtT = d => d ? fmt(d) + (d.length > 10 ? ' ' + d.slice(11, 16) : '') : '';
const asDate = d => new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
const daysTo = d => Su.daysUntil(asDate(d));
const addDays = (d, n) => { const t = asDate(d); t.setDate(t.getDate() + n); return Su.iso(t); };
const rel = d => { const n = daysTo(d); if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday'; if (n < 0) return Math.abs(n) + ' days ago'; if (n < 60) return 'in ' + n + ' days'; return 'in ' + Math.round(n / 30.4) + ' months'; };
const co = () => Su.company();
const mailbox = () => 'suppliers@' + Su.slug() + '.example';
const person = id => Su.person(id);
const short = (s, n) => s.length > n ? s.slice(0, n - 1).trim() + '…' : s;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const fileSlug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function toast(m) { const r = document.getElementById('toastRoot'); r.innerHTML = '<div class="toast" role="status">' + esc(m) + '</div>'; clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 3200); }

/* ---------- data ---------- */
let DB = null;
const ui = { role: 'sm', tab: 'overview', sel: null, f: '', cat: '', q: '', sort: 'status', dir: 1, supId: null, prefill: '',
  sup: { stage: 'inbox', mail: 0, codeSent: false, step: 0, visited: {}, draft: null, form: null } };

function insNeed(k, cat) {
  if (k === 'el' || k === 'pl') return true;
  if (k === 'pi') return cat === 'Professional services' || cat === 'IT and software';
  if (k === 'prod') return cat === 'Materials' || cat === 'PPE and workwear';
  return false;
}
function blankDraft(s) {
  const ins = {}; INS.forEach(([k]) => { ins[k] = { held: '', limit: '', insurer: '', exp: '', file: null, reason: '' }; });
  return { cat: s.cat || '', company: s.name, email: s.email, contact: s.contact, addr: '', phone: s.phone || '', position: s.position || '', supplies: '', years: '', coNo: '', vat: '', ins, a: {}, decl: { name: '', pos: '', ok: false } };
}
function sampleAnswer(x, slug) {
  const out = {};
  if (SAMPLE[x.id] !== undefined) out[x.id] = SAMPLE[x.id];
  else if (x.type === 'yn') out[x.id] = x.flag === 'Yes' ? 'No' : 'Yes';
  else if (x.type === 'yna') out[x.id] = x.flag === 'Yes' ? 'No' : 'Yes';
  else if (x.type === 'ynfile') out[x.id] = 'No';
  else if (x.type === 'number') out[x.id] = '3';
  else if (x.type === 'date') out[x.id] = todayISO();
  else if (x.type === 'file') out[x.id] = { name: slug + '-' + x.id.toLowerCase() + '.pdf' };
  else out[x.id] = 'Sample answer for the demo.';
  if (x.follow && out[x.id] === 'Yes') out[x.id + '_more'] = 'Sample detail for the demo.';
  return out;
}
function seed() {
  const form = clone(DEFAULT_FORM), sups = [];
  const sm = person('sm').name, ak = person('ak').name, dm = person('dm').name;
  function add(o) {
    const n = sups.length + 1, slug = fileSlug(o.name.replace(/ (Ltd|Services Ltd)$/, ''));
    const s = { id: 'SUP-' + pad(n, 4), ref: 'SQ-' + (1040 + n), name: o.name, cat: o.cat, contact: o.contact, position: o.position,
      email: o.contact.toLowerCase().replace(/[^a-z ]/g, '').split(' ').join('.') + '@' + slug.replace(/-/g, '') + '.example', phone: '01632 960' + (100 + n * 7),
      purpose: 'New supplier', sentAt: dt(o.sent, '09:1' + (n % 10)), expiresAt: dIso(o.sent + 30), stage: 'Invited', revoked: false, reminders: [], code: null, codeAt: null,
      draft: null, sub: null, hs: null, rec: null, decision: null, changes: null, events: [] };
    const ev = (at, text, by) => s.events.unshift({ at, text, by: by || '' });
    ev(s.sentAt, 'Invitation emailed to ' + s.email + ' (new supplier), questionnaire v1', sm);
    (o.remind || []).forEach(r => { s.reminders.push(dt(r, '08:00')); ev(dt(r, '08:00'), 'Automatic reminder emailed to supplier'); });
    if (o.opened !== undefined) { s.stage = 'Opened'; ev(dt(o.opened, '10:42'), 'Link opened by supplier'); }
    const mk = part => {
      const d = blankDraft(s);
      Object.assign(d, { addr: o.addr, position: o.position, supplies: o.supplies, years: o.years, coNo: 'ZZ' + (104200 + n * 37), vat: o.vat === false ? '' : 'GB 000 ' + (4100 + n * 13) + ' ' + pad(n * 7 % 100, 2) });
      INS.forEach(([k]) => { const i = (o.ins || {})[k];
        d.ins[k] = i ? { held: 'Yes', limit: String(i[0]), insurer: i[2] || 'Northmere Mutual', exp: dIso(i[1]), file: { name: slug + '-' + k + '-certificate.pdf' }, reason: '' }
          : { held: 'No', limit: '', insurer: '', exp: '', file: null, reason: insNeed(k, o.cat) ? ((o.reason || {})[k] || 'Not needed for the work we do.') : '' }; });
      form.sections.forEach(sec => { if (part && (sec.id === 'refs')) return; sec.questions.forEach(x => Object.assign(d.a, sampleAnswer(x, slug))); });
      Object.keys(o.a || {}).forEach(k => { d.a[k] = o.a[k] === 'FILE' ? { name: slug + '-' + k.replace('_file', '').toLowerCase() + '-certificate.pdf' } : o.a[k]; });
      if (!part) d.decl = { name: o.contact, pos: o.position, ok: true };
      return d;
    };
    if (o.started !== undefined) { s.stage = 'In progress'; s.draft = mk(true);
      ev(dt(o.started, '14:05'), 'Link opened by supplier'); ev(dt(o.started, '14:07'), 'Email checked with a one-time code; supplier signed in');
      ev(dt(o.started, '14:08'), 'Company confirmed; ' + PRIV_VERSION + ' read and accepted'); ev(dt(o.started, '14:31'), 'Supplier started filling in; draft saved'); }
    if (o.sub !== undefined) {
      s.stage = 'Submitted'; s.sub = { at: dt(o.sub, '15:2' + (n % 10)), form: clone(form), data: mk(false) };
      ev(dt(o.sub, '14:40'), 'Email checked with a one-time code; supplier signed in');
      ev(s.sub.at, 'Submitted and signed by ' + o.contact + '; answers locked (questionnaire v1)');
      ev(s.sub.at, 'Record copy created and emailed to ' + s.email);
    }

  mail: b => { ui.sup.mail = +b.dataset.i; render(); },
  supStage: b => { ui.sup.stage = b.dataset.stage; render(); },
  follow: () => { const s = curSup(); ui.sup.stage = 'link'; ui.sup.codeSent = false; if (!linkProblem(s) && s.stage === 'Invited') { stage(s, 'Opened'); log(s, 'Link opened by supplier'); save(); } render(); window.scrollTo(0, 0); },
  sendCode: () => { const s = curSup(); s.code = String(Math.floor(100000 + Math.random() * 900000)); s.codeAt = nowStamp(); ui.sup.codeSent = true; ui.sup.tries = 0; log(s, 'One-time sign-in code emailed to ' + s.email); save(); render(); const c = document.getElementById('c0'); if (c) c.focus(); },
  useCode: () => { const s = curSup(); s.code.split('').forEach((ch, i) => { const el = document.getElementById('c' + i); if (el) el.value = ch; }); },
  verify: () => { const s = curSup(), code = [0, 1, 2, 3, 4, 5].map(i => document.getElementById('c' + i).value).join(''), er = document.getElementById('cerr');
    if (code.length < 6) { er.textContent = 'Enter all 6 digits.'; return; }
    if (code !== s.code) { ui.sup.tries = (ui.sup.tries || 0) + 1; er.textContent = ui.sup.tries >= 5 ? 'Too many wrong codes. Ask for a new one.' : 'That code isn’t right.'; return; }
    ui.sup.stage = 'confirm'; stage(s, 'Signed in'); log(s, 'Email checked with a one-time code; supplier signed in'); save(); render(); },
  privacy: () => openPrivacy(),
  privOk: () => { ui.sup.privOpened = true; ui.sup.cfPriv = true; closeModal(); render(); },
  startForm: () => { const a = document.getElementById('cfCo'), p = document.getElementById('cfPriv'); if (!a.checked || !p.checked) { toast(ui.sup.privOpened ? 'Please tick both boxes to continue' : 'Open the privacy notice, then tick both boxes'); return; }
    const s = curSup(), base = blankDraft(s); ui.sup.draft = s.draft ? Object.assign(base, clone(s.draft)) : base; INS.forEach(([k]) => { if (!ui.sup.draft.ins[k]) ui.sup.draft.ins[k] = base.ins[k]; });
    ui.sup.form = clone(DB.form); ui.sup.stage = 'form'; ui.sup.visited = {}; ui.sup.step = Math.min(firstOpen(), secs().length - 1);
    stage(s, 'Confirmed'); log(s, 'Company confirmed; ' + PRIV_VERSION + ' read and accepted; questionnaire v' + DB.form.version); save(); render(); window.scrollTo(0, 0); },
  forward: () => { const n = document.getElementById('fwName').value.trim(), em = document.getElementById('fwEmail').value.trim(); if (!n || !EMAIL.test(em)) { toast('Enter your colleague’s name and email'); return; }
    const s = curSup(), old = s.contact; s.contact = n; s.email = em; s.code = null; s.sentAt = nowStamp(); s.expiresAt = dIso(DB.rules.linkDays); s.stage = 'Invited'; s.reminders = [];
    log(s, 'Passed on by ' + old + ' to ' + n + ' (' + em + '); the old link no longer works and a new one was sent'); save(); resetSup(s.id); render(); toast('Sent to ' + n); },
  signOut: () => { if (D()) saveDraft(); ui.sup.stage = 'inbox'; ui.sup.codeSent = false; render(); },
  setv: b => { setv(b.dataset.p, b.dataset.v); render(); },
  ans: b => { D().a[b.dataset.id] = b.dataset.v; render(); },
  sampleFile: b => { const s = curSup(), key = b.dataset.key, rec = { name: fileSlug(s.name) + '-' + key.replace(/^ins\.|\.file$|_file$/g, '').toLowerCase() + '-certificate.pdf' }; if (b.dataset.kind === 'p') setv(key, rec); else D().a[key] = rec; render(); },
  fillSec: fillSection,
  step: b => { const i = +b.dataset.i; if (locked(i)) { toast('Finish the earlier sections first'); return; } goStep(i); },
  toReview: () => { if (firstOpen() < secs().length) { toast('Finish all sections first'); return; } secs().forEach((_, i) => { ui.sup.visited[i] = 1; }); ui.sup.stage = 'review'; saveDraft(); render(); window.scrollTo(0, 0); },
  fNext: () => { const sp = ui.sup; if (secErrs(secs()[sp.step]).length) { sp.visited[sp.step] = 1; saveDraft(); render(); window.scrollTo(0, 0); toast('Please complete this section before moving on'); return; }
    if (sp.step + 1 >= secs().length) ACT.toReview(); else goStep(sp.step + 1); },
  fBack: () => goStep(Math.max(0, ui.sup.step - 1)),
  rBack: () => { ui.sup.stage = 'form'; ui.sup.step = secs().length - 1; render(); },
  submit: () => { const s = curSup(), t = nowStamp(), again = !!s.changes;
    s.sub = { at: t, form: clone(F()), data: clone(D()) }; s.draft = null; s.changes = null; s.hs = null; s.rec = null; s.stage = 'Submitted';
    log(s, (again ? 'Submitted again' : 'Submitted') + ' and signed by ' + D().decl.name + '; answers locked (questionnaire v' + F().version + ')'); log(s, 'Record copy created and emailed to ' + s.email);
    ui.sup.draft = null; ui.sup.stage = 'done'; save(); render(); window.scrollTo(0, 0); },
  seeOffice: () => { const s = curSup(); ui.role = 'sm'; ui.tab = 'register'; ui.sel = s.id; render(); window.scrollTo(0, 0); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName === 'A') e.preventDefault();
  fn(b, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && mRoot().innerHTML) { closeModal(); return; }
  const t = e.target;
  if (e.key === 'Enter' && t.matches && t.matches('tr[data-act]')) ACT.open(t);
  if (t.closest && t.closest('#codeIn')) { const i = +t.id.slice(1); if (e.key === 'Backspace' && !t.value && i > 0) document.getElementById('c' + (i - 1)).focus(); if (e.key === 'Enter') ACT.verify(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.q = t.value.trim().toLowerCase(); render(); return; }
  if (t.closest('#codeIn')) { t.value = t.value.replace(/\D/g, '').slice(-1); const n = document.getElementById('c' + (+t.id.slice(1) + 1)); if (t.value && n) n.focus(); return; }
  if (t.dataset.p && D()) { setv(t.dataset.p, t.value); return; }
  if (t.dataset.txt && D()) { D().a[t.dataset.txt] = t.value; }
});
document.addEventListener('paste', e => {
  if (!e.target.closest || !e.target.closest('#codeIn')) return;
  const t = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!t) return;
  e.preventDefault(); t.split('').forEach((c, j) => { const el = document.getElementById('c' + j); if (el) el.value = c; });
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'roleSel') { setRole(t.value); return; }
  if (t.id === 'supPick') { if (D()) saveDraft(); resetSup(t.value); render(); return; }
  if (t.id === 'cfCo') { ui.sup.cfCo = t.checked; return; }
  if (t.id === 'cfPriv') { ui.sup.cfPriv = t.checked; return; }
  if (t.id === 'declOk' && D()) { D().decl.ok = t.checked; return; }
  if (t.dataset.up && D()) { const f = t.files && t.files[0]; if (!f) return; if (f.size > 10 * 1024 * 1024) { toast('That file is over 10 MB'); return; } const rec = { name: f.name }; if (t.dataset.up === 'p') setv(t.dataset.key, rec); else D().a[t.dataset.key] = rec; render(); return; }
  if (t.dataset.rule) { const k = t.dataset.rule, v = Math.max(0, Math.round(+t.value || 0)), isMin = k.indexOf('min.') === 0, label = t.closest('.field').querySelector('label').textContent;
    if (!isMin && v < 1) { toast('Enter 1 or more'); render(); return; }
    if (isMin) DB.rules.min[k.slice(4)] = v; else DB.rules[k] = v;
    DB.formlog.unshift({ at: nowStamp(), version: DB.form.version, text: 'Rule changed: ' + label + ' is now ' + v, by: me().name }); save(); render(); toast('Rule saved'); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'inviteForm') return;
  e.preventDefault();
  const f = e.target, name = f.iCo.value.trim(), nm = f.iName.value.trim(), em = f.iEmail.value.trim();
  f.iCo.classList.toggle('err', !name); f.iName.classList.toggle('err', !nm); f.iEmail.classList.toggle('err', !EMAIL.test(em));
  if (!name || !nm || !EMAIL.test(em)) { toast('Fill in the company, a contact name and a valid email'); return; }
  const t = nowStamp();
  let s = DB.sups.find(x => x.name.toLowerCase() === name.toLowerCase() && (x.decision && x.decision.outcome === 'Rejected' || x.revoked || !x.sub && !x.decision));
  DB.seq += 1;
  const fresh = { ref: 'SQ-' + (1040 + DB.seq), cat: f.iCat.value, contact: nm, email: em, purpose: s ? 'Invited again' : 'New supplier', sentAt: t, expiresAt: dIso(DB.rules.linkDays), stage: 'Invited', revoked: false, reminders: [], code: null, codeAt: null, draft: null, sub: null, hs: null, rec: null, decision: null, changes: null };
  if (s) Object.assign(s, fresh);
  else { s = Object.assign({ id: 'SUP-' + pad(DB.sups.length + 1, 4), name, position: '', phone: '', events: [] }, fresh); DB.sups.push(s); }
  log(s, 'Invitation emailed to ' + em + ' (' + fresh.purpose.toLowerCase() + '), questionnaire v' + DB.form.version, me().name);
  ui.prefill = ''; resetSup(s.id); save(); render();
  toast('Sent ' + s.ref + ' to ' + nm + '. Change “View as” to “A supplier” to see the email.');
});

/* ---------- start ---------- */
DB = Su.load('suppliers', VERSION);
if (!DB || !Array.isArray(DB.sups) || !DB.form || !DB.rules) DB = seed();
const slot = document.getElementById('suite-slot');
if (slot) slot.innerHTML = '<label><span>View as</span> <select id="roleSel" aria-label="View as">' + STAFF.map(id => '<option value="' + id + '">' + esc(person(id).name) + ' · ' + esc(person(id).role) + '</option>').join('') + '<option value="sup">A supplier (outside the company)</option></select></label>';
const tryPanel = document.getElementById('suite-try');
if (tryPanel) { const upd = () => document.body.classList.toggle('try-open', !tryPanel.hidden); new MutationObserver(upd).observe(tryPanel, { attributes: true, attributeFilter: ['hidden'] }); upd(); }
Su.onChange(render);
render();
window.SuppliersDemo = { summary: summary, state: () => DB };
})();
</script>
</body>
