<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training matrix · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/suite.css">
<style>
/* Colours: neutrals and the accent come from the suite, so the page follows the visitor's colour and light/dark choice.
   Status colours (green, amber, red, blue) are the module's own. */
:root{
  --page:var(--suite-page);--surface:var(--suite-surface);--sunk:var(--suite-sunk);--line:var(--suite-line);--divider:#ECEEF2;--field:var(--suite-line-2);
  --ink:var(--suite-ink);--body:#565E6B;--faint:#8A919C;--label:var(--suite-label);
  --accent:var(--suite-accent);--accent-text:var(--suite-accent-ink);--accent-tint:var(--suite-accent-tint);--accent-border:var(--suite-accent-line);
  --head:#232830;--head-text:#FFFFFF;--head-line:#3D4450;--band:#FAFBFC;--row-hover:#F3F5F8;
  --good:#2D7A59;--good-tint:#E7F2ED;--good-border:#C6DED4;
  --bad:#B23A2E;--bad-tint:#F8E7E4;--bad-border:#EFC9C3;
  --warn:#8A5D0C;--warn-tint:#FBF0DC;--warn-border:#EBD6AC;
  --info:#1F4E8C;--info-tint:#E4EEFA;--info-border:#BBD2EF;
  --on-ink:#FFFFFF;--tip-bg:#14171C;--tip-text:#FFFFFF;--scrim:rgba(20,23,28,.4);--shadow:0 12px 32px rgba(20,23,28,.16);
  --f-head:var(--suite-font);--f-body:var(--suite-font);--f-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
:root[data-theme="dark"]{
  --divider:#26292E;--body:#B4BBC6;--faint:#7F8794;
  --head:#272B31;--head-text:#F1F3F6;--head-line:#3C4149;--band:#202327;--row-hover:#23262B;
  --good:#6CC59A;--good-tint:#173126;--good-border:#2A5440;--bad:#F08A7E;--bad-tint:#3A1B18;--bad-border:#5E2C27;
  --warn:#E9B65C;--warn-tint:#33270F;--warn-border:#5A4519;--info:#86B4EE;--info-tint:#17263A;--info-border:#2B4366;
  --on-ink:#14171C;--tip-bg:#F1F3F6;--tip-text:#14171C;--scrim:rgba(0,0,0,.6);--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--body)}
.faint{color:var(--faint)}

/* Page */
.main{min-width:0;padding:18px 16px 40px}
.canvas{max-width:1880px;margin:0 auto}
.mine .canvas{max-width:1080px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.band{background:var(--band);border-bottom:1px solid var(--line);padding:14px 20px 0}
.crumb{font-size:13.5px;color:var(--body)}
.crumb a{color:var(--accent-text);text-decoration:none;font-weight:600}
.titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.titlerow h1{font:700 22.5px/1.1 var(--f-head);margin:0;letter-spacing:.2px}
.titlerow .sp{flex:1}
.tabs{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px 11px;font-size:15px;font-weight:600;color:var(--body);border-radius:8px 8px 0 0;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{background:var(--sunk)}
.tab[aria-selected="true"]{background:var(--accent-tint);color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{background:var(--sunk);color:var(--body);border-radius:99px;padding:0 7px;font-size:12px;font-weight:700;min-width:22px;text-align:center}
.tab[aria-selected="true"] .n{background:var(--accent)}
.tabdesc{margin-left:auto;align-self:center;color:var(--body);font-size:13.5px;padding-left:16px;white-space:nowrap}
.body{padding:16px 20px 20px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-ink)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{width:16px;height:16px;flex:none}

/* Filters */
.filters{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin-bottom:14px}
.flabel{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--label);font-weight:700;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.chip .c{color:var(--body);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip[aria-pressed="true"] .c{color:var(--on-ink);opacity:.8}
.chip.flag-bad{color:var(--bad);border-color:var(--bad-border)}
.chip.flag-bad[aria-pressed="true"]{background:var(--bad);color:var(--on-ink)}
.vdiv{width:1px;height:20px;background:var(--line);margin:0 4px}
.search{height:32px;border:1px solid var(--field);border-radius:8px;padding:0 10px;width:260px;max-width:100%;background:var(--surface)}
select.sel{height:32px;border:1px solid var(--field);border-radius:8px;padding:0 8px;background:var(--surface)}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{position:sticky;top:0;background:var(--head);color:var(--head-text);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:0 12px;height:40px;white-space:nowrap;border-right:1px solid var(--head-line);z-index:2}
.t th:last-child{border-right:0}
.t td{padding:0 12px;height:52px;border-bottom:1px solid var(--divider);border-right:1px solid var(--divider);vertical-align:middle;max-width:380px}
.t td:last-child{border-right:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover{background:var(--row-hover)}
.t tbody tr.sel{background:var(--accent-tint)}
.t tbody tr.ended td{color:var(--faint)}
.t .cut{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .sub{display:block;font-size:12.5px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .strong{font-weight:600}
.foot{color:var(--body);font-size:13px;padding:8px 2px 0}
.empty{padding:28px;text-align:center;color:var(--body)}

/* Badges and status */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-good{color:var(--good);background:var(--good-tint);border-color:var(--good-border)}
.b-warn{color:var(--warn);background:var(--warn-tint);border-color:var(--warn-border)}
.b-bad{color:var(--bad);background:var(--bad-tint);border-color:var(--bad-border)}
.b-info{color:var(--info);background:var(--info-tint);border-color:var(--info-border)}
.b-none{color:var(--body);background:var(--surface);border-color:var(--line)}
.b-ended{color:var(--faint);background:var(--sunk)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--body);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:2px;display:inline-block}
.typetag{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--label);font-weight:700}

/* Matrix */
.mx{border-collapse:separate;border-spacing:0;font-size:13px}
.mx th,.mx td{border-bottom:1px solid var(--divider);border-right:1px solid var(--divider)}
.mx thead th{position:sticky;top:0;background:var(--head);color:var(--head-text);z-index:2;vertical-align:bottom;padding:8px 4px;font-weight:600;font-size:12px}
.mx thead th.rot{height:190px;width:42px;min-width:42px}
.mx thead th.rot div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto;max-height:178px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.mx thead th.grp{height:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:center;border-bottom:1px solid var(--head-line)}
.mx .pc{position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px;max-width:230px;padding:6px 12px;text-align:left}
.mx thead .pc{z-index:3;background:var(--head)}
.mx tbody tr:hover td,.mx tbody tr:hover .pc{background:var(--row-hover)}
.mx td.cell{width:42px;min-width:42px;height:40px;text-align:center;cursor:pointer;padding:0}
.mx td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.cs{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:6px;font-size:13px;font-weight:700}
.cs.v{color:var(--good);background:var(--good-tint)}
.cs.e{color:var(--warn);background:var(--warn-tint)}
.cs.x{color:var(--bad);background:var(--bad-tint)}
.cs.m{color:var(--bad);border:1.5px dashed var(--bad-border);background:none}
.cs.p{color:var(--info);background:var(--info-tint)}
.cs.h{color:var(--faint);background:none}
.cs.w{color:var(--faint);background:var(--sunk);text-decoration:line-through}
.cs .bk{font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--body);align-items:center;margin:10px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Overview tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent-border);background:var(--row-hover)}
.tile .big{font:700 24px/1 var(--f-head)}
.tile .lab{font-weight:600}
.tile .s{font-size:12.5px;color:var(--body)}
.tile.bad .big{color:var(--bad)}.tile.warn .big{color:var(--warn)}.tile.info .big{color:var(--info)}.tile.good .big{color:var(--good)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.sect{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sect>h3{margin:0;padding:10px 14px;font:600 14.5px/1.2 var(--f-head);background:var(--band);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sect>h3 .sp{flex:1}
.sect .in{padding:12px 14px}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--divider)}
.alist li:last-child{border-bottom:0}
.alist .who{flex:1;min-width:0}
.alist .who b{display:block;font-weight:600}
.alist .who span{display:block;font-size:13px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Side panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:60;display:flex;flex-direction:column;transform:translateX(0);transition:transform .2s ease,opacity .2s ease}
.panel[hidden]{display:none!important}
.ph{padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--band)}
.ph .row{display:flex;gap:8px;align-items:flex-start}
.ph .code{font-family:var(--f-mono);color:var(--accent-text);font-size:13px}
.ph h2{margin:2px 0 4px;font:700 19px/1.15 var(--f-head)}
.ph .subl{color:var(--body);font-size:13.5px}
.ph .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ph .sp{flex:1}
.pb{overflow-y:auto;padding:14px 18px 30px;display:flex;flex-direction:column;gap:14px}
.pb>*{flex:none}
.warnbox{border:1px solid var(--bad-border);background:var(--bad-tint);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:13.5px}
.warnbox.w{border-color:var(--warn-border);background:var(--warn-tint);color:var(--warn)}
.warnbox.i{border-color:var(--info-border);background:var(--info-tint);color:var(--info)}
dl.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:7px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--label);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.reqlist{display:flex;flex-direction:column}
.req{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--divider)}
.req:last-child{border-bottom:0}
.req .nm{flex:1;min-width:0}
.req .nm b{font-weight:600;display:block}
.req .nm span{font-size:12.5px;color:var(--body)}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 12px 12px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--faint)}
.timeline li.cur::before{border-color:var(--good);background:var(--good)}
.timeline .when{color:var(--body);font-size:12.5px}
.menu{position:absolute;right:0;top:36px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:230px;padding:6px;z-index:80;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--sunk)}
.menu button.r{color:var(--bad)}
.rel{position:relative}

/* Dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);z-index:90;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:760px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.dlg.narrow{width:520px}
.dh{padding:16px 20px 10px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:700 19px/1.15 var(--f-head)}
.dh p{margin:4px 0 0;color:var(--body);font-size:13.5px}
.dlg form{display:flex;flex-direction:column;min-height:0;flex:1}
.db{padding:14px 20px;overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.df .sp{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}dl.kv{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:5px}
.f .req-mark{color:var(--bad)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--field);border-radius:8px;padding:6px 9px;background:var(--surface);min-height:34px}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:12.5px;color:var(--body)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.f .msg{font-size:12.5px;color:var(--bad)}
.calc{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:7px 9px;min-height:34px;display:flex;align-items:center}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{font-weight:400;display:flex;gap:6px;align-items:center;font-size:14px}
.fs{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.fs>.legendt{font:600 13.5px/1.2 var(--f-head);display:flex;gap:6px;align-items:center}
.catrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--divider)}
.catrow:last-child{border-bottom:0}
.catrow label{font-weight:400!important}
.email{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sunk);font-size:14px}
.email .hdr{font-size:13px;color:var(--body);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}

/* Help */
.help{width:18px;height:18px;border-radius:50%;border:1px solid var(--field);background:var(--surface);color:var(--body);font-size:11px;font-weight:700;display:inline-grid;place-items:center;cursor:pointer;padding:0;line-height:1;flex:none}
.help:hover,.help[aria-expanded="true"]{background:var(--accent-tint);color:var(--accent-text);border-color:var(--accent-border)}
th .help{border-color:var(--head-line);background:transparent;color:var(--head-text);margin-left:4px;vertical-align:middle}
.helpcard{position:fixed;z-index:120;width:320px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13.5px;color:var(--ink)}
.helpcard h4{margin:0 0 4px;font:700 13.5px/1.2 var(--f-head)}
.helpcard p{margin:0 0 6px;color:var(--body)}
.helpcard p:last-child{margin-bottom:0}
.helpcard .eg{font-size:12.5px;color:var(--body);border-top:1px solid var(--divider);padding-top:6px;margin-top:6px}
.helpcard .eg b{color:var(--ink)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-text);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:130;font-size:14px;max-width:90vw}
.reqgrid th.rot{height:150px}
.lvl{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--body)}
.lvl.M{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.lvl.T{background:var(--info-tint);color:var(--info);border-color:var(--info-border)}
.lvl.D{background:var(--sunk);color:var(--body)}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.note{font-size:13px;color:var(--body);margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Action List v2 ===== */
[data-tip]{cursor:help}
label [data-tip],dt [data-tip],th [data-tip],.lbl [data-tip]{text-decoration:underline dotted;text-decoration-color:var(--faint);text-underline-offset:3px}
th [data-tip]{text-decoration-color:var(--head-line)}
.helpcard.tip{pointer-events:none}
.viewsw{display:flex;gap:4px;align-items:center;justify-content:flex-start;margin:-4px 0 12px;font-size:13px;flex-wrap:wrap}
.viewsw .faint{margin-right:6px}
.seg{border:1px solid var(--line);background:var(--surface);padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--body);border-radius:8px}
.seg[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent-border);color:var(--ink)}
.ncstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-tint);border:1px solid var(--bad-border);color:var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ncstrip.ok{background:var(--good-tint);border-color:var(--good-border);color:var(--good)}
.ncchip{border:1px solid var(--bad-border);background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer}
.ncchip b{font-weight:700}
.ncchip:hover{border-color:var(--bad)}
.axbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}

const DAY = 864e5;
const TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();
const pad = (n) => String(n).padStart(2, "0");
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (n, from) => { const d = from ? parseIso(from) : new Date(TODAY); d.setDate(d.getDate() + n); return isoOf(d); };
const addMonths = (s, m) => { const d = parseIso(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return isoOf(d); };
const uk = (s) => (s ? s.split("-").reverse().join("/") : "—");
const daysTo = (s) => Math.round((parseIso(s) - TODAY) / DAY);
const TODAY_ISO = isoOf(TODAY);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hash = (s) => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); };
const nowStamp = () => { const d = new Date(); return `${isoOf(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

  return "—";
};

const calcExpiry = (code, achieved) => { const v = CAT[code].val; if (!achieved) return ""; if (typeof v === "number") return addMonths(achieved, v); if (v && v.recheck) return addMonths(achieved, v.recheck); return ""; };

  });

  cols.sort((a, b) => AREA_ORDER.indexOf(a.area) - AREA_ORDER.indexOf(b.area) || a.code.localeCompare(b.code));
  const groups = []; cols.forEach((c) => { const g = groups[groups.length - 1]; if (g && g.area === c.area) g.n++; else groups.push({ area: c.area, n: 1 }); });

    return `<tr><td class="pc"><a href="#" data-act="openp" data-pid="${p.id}" style="color:inherit;font-weight:600">${esc(p.name)}</a>${ev.cleared ? "" : ` <span class="badge b-bad" style="padding:0 6px">Not cleared</span>`}<span class="sub" style="display:block;font-size:12px;color:var(--body)">${esc(p.team)} · ${esc(p.roles.join(", "))}${p.type === "Subcontractor" ? " · " + esc(p.company) : ""}</span></td>${cells}</tr>`;

function actionModel() {
  const out = [];
  activePeople().forEach((p) => {
    personEval(p).reqs.forEach((r) => {
      if (r.level === "D" || (r.level === "T" && r.st === "M")) return;
      const bk = r.booked;
      if (!(["X", "M", "W", "E", "P"].includes(r.st) || bk)) return;
      const c = CAT[r.code];
      const days = r.h && r.h.expiry && ["X", "E", "V"].includes(r.st) ? daysTo(r.h.expiry) : null;
      const stage = r.st === "P" ? "check" : bk && bk.date < TODAY_ISO ? "due" : bk ? "booked" : "book";
      const critical = c.blocking && r.level === "M";
      const bucket = stage === "booked" ? "booked" : stage !== "book" || ["X", "M", "W"].includes(r.st) ? "now" : days <= 30 ? "soon" : "later";
      const urg = r.st === "M" || r.st === "W" ? -100000 : stage === "due" ? -50000 : days ?? 99999;
      out.push({ key: `${p.id}-${r.code}`, p, r, c, days, stage, critical, bucket, urg });

  return out.sort((a, b) => a.urg - b.urg || (b.critical - a.critical) || a.p.name.localeCompare(b.p.name));

}

/* ===== "View as" an employee: a person sees only their own record (and their direct reports' status) ===== */
const mineEligible = (code) => { const c = CAT[code]; return !!c && c.status === "Active" && c.type !== "CAT" && c.type !== "AUTH" && !isCard(code) && !c.refOnly; };
function mineShell() {
  const p = P(S.viewer), ev = personEval(p), left = p.status === "Left";
  const todo = ev.reqs.filter((r) => r.level !== "D" && !(r.level === "T" && r.st === "M") && ["X", "M", "W", "E", "P"].includes(r.st));
  const booked = S.bookings.filter((b) => b.pid === p.id && !b.done);
  const banner = left ? `<div class="warnbox i" style="margin-bottom:12px">Left on ${uk(p.leaving.date)}. These records are read-only.</div>`
    : ev.cleared ? `<div class="ncstrip ok"><b>You are cleared to work in ${esc(p.team)} today.</b><span>${todo.length ? `${todo.length} item${todo.length === 1 ? " needs" : "s need"} attention soon.` : "Everything you need is in date."}</span></div>`
    : `<div class="ncstrip"><b>You are not cleared today for work that needs:</b>${ev.blockers.map((b) => `<span class="ncchip" style="cursor:default"><b>${esc(CAT[b.code].short)}</b> ${ST[b.st].name.toLowerCase()}</span>`).join("")}<span>Speak to ${esc(p.lm)} before you start that work.</span></div>`;
  const tile = (tone, big, lab, s) => `<div class="tile ${tone}" style="cursor:default"><span class="big num">${big}</span><span class="lab">${lab}</span><span class="s">${s}</span></div>`;
  const row = (r) => {
    const c = CAT[r.code], h = r.h;
    const exp = h && h.expiry ? `${daysTo(h.expiry) < 0 ? "Expired" : "Expires"} ${uk(h.expiry)}` : h ? "No expiry" : "No record on file";
    const stBadge = r.st === "M" && r.level !== "M" ? `<span class="badge b-none">Not held</span>` : badge(r.st);
    const can = !left && mineEligible(r.code) && ["M", "X", "E"].includes(r.st) && !(r.via && r.st === "E");
    return `<div class="req"><div class="nm"><b>${esc(c.title)}</b><span>${LVNAME[r.level]} for ${esc(r.from)} · ${exp}${r.via ? " · met by " + esc(CAT[r.via].short) : ""}${r.booked ? " · course booked for " + uk(r.booked.date) : ""}${c.blocking && r.level === "M" ? " · Safety-critical" : ""}</span></div>${stBadge}${h ? `<button class="btn sm" data-act="viewcert" data-rid="${h.rec.id}">${c.refOnly ? "View check" : "View certificate"}</button>` : ""}${can ? `<button class="btn sm pri" data-act="minecert" data-code="${r.code}">Add my certificate</button>` : ""}</div>`;
  };
  const reqCodes = new Set(ev.reqs.flatMap((r) => [r.code, r.via].filter(Boolean)));
  const others = S.records.filter((r) => r.pid === p.id && !r.supersededBy && !reqCodes.has(r.code) && !(r.cats.length && r.cats.every((c) => reqCodes.has(c.code))));
  const otherHtml = others.map((r) => `<div class="req"><div class="nm"><b>${esc(CAT[r.code].title)}</b><span>${r.cats.length ? r.cats.map((c) => esc(CAT[c.code].short)).join(", ") + " · " : ""}${r.expiry ? "Expires " + uk(r.expiry) : "No expiry on the record"}</span></div>${badge(statusOf(r.expiry, r, null, r.code))}<button class="btn sm" data-act="viewcert" data-rid="${r.id}">${CAT[r.code].refOnly ? "View check" : "View certificate"}</button></div>`).join("");
  const reports = left ? [] : activePeople().filter((x) => x.lm === p.name && x.id !== p.id);
  const teamHtml = reports.map((x) => {
    const e = personEval(x);
    const gaps = e.reqs.filter((r) => r.level === "M" && ["X", "M", "W", "E", "P"].includes(r.st));
    return `<div class="req"><div class="nm"><b>${esc(x.name)}</b><span>${esc(x.roles.join(", "))} · ${gaps.length ? gaps.map((r) => `${esc(CAT[r.code].short)} ${r.st === "E" ? "expires " + uk(r.h.expiry) : ST[r.st].name.toLowerCase()}`).join(" · ") : "everything in date"}</span></div>${e.cleared ? '<span class="badge b-good">✓ Cleared</span>' : '<span class="badge b-bad">✕ Not cleared</span>'}</div>`;
  }).join("");
  return `<main class="main mine"><div class="canvas">
    ${viewAsMobile()}
    <div class="card">
      <div class="band">
        <div class="crumb"><b>${esc(Suite.company())}</b> · ${esc(p.team)} · ${esc(p.roles.join(", "))} · reports to ${esc(p.lm)}</div>
        <div class="titlerow"><h1>My training</h1><span class="pill">${esc(p.name)}</span><span class="sp"></span>${left ? "" : `<button class="btn pri" data-act="minecert">${ICON.plus}Add my certificate</button>`}</div>
      </div>
      <div class="body" id="tabbody" tabindex="-1">
        ${banner}
        <div class="tiles">${tile(ev.met === ev.mand.length ? "good" : "warn", `${ev.met} of ${ev.mand.length}`, "Mandatory items held", "For your team and roles")}${tile(todo.length ? "warn" : "good", todo.length, "Need attention", "Expired, missing, due soon or being checked")}${tile("", ev.nextExpiry ? uk(ev.nextExpiry) : "—", "Next expiry", "The first date to watch")}${tile("info", booked.length, "Courses booked", booked.length ? booked.map((b) => `${esc(CAT[b.code].short)} ${uk(b.date)}`).join(", ") : "Nothing booked for you")}</div>
        ${sect("What I need", `<div class="reqlist">${ev.reqs.map(row).join("") || '<p class="muted" style="margin:0">Nothing is required for your team and role yet.</p>'}</div>`)}
        ${reports.length ? `<div style="height:14px"></div>` + sect(`My team today <span class="muted" style="font:400 13px var(--f-body)">${reports.length} ${reports.length === 1 ? "person reports" : "people report"} to you</span>`, `<div class="reqlist">${teamHtml}</div>`) : ""}
        ${otherHtml ? `<div style="height:14px"></div>` + sect("Other records I hold", `<div class="reqlist">${otherHtml}</div>`) : ""}
        <p class="foot">You can see your own record only. ${esc(USERS[0])} and ${esc(USERS[1])} manage the register and verify every certificate against the original.</p>
      </div>
    </div>
  </div></main>
  <aside class="panel" id="panel" hidden aria-label="Details"></aside>
  <div id="dlgroot"></div>`;
}
function dlgMine(code) {
  const p = P(S.viewer), ev = personEval(p);
  const opts = ev.reqs.filter((r) => r.level !== "D" && mineEligible(r.code)).map((r) => [r.code, `${CAT[r.code].title}${["M", "X", "E"].includes(r.st) ? " (" + ST[r.st].name.toLowerCase() + ")" : ""}`]);
  openDlg({
    title: "Add my certificate", narrow: true, sub: `It goes to ${esc(USERS[0])} to verify against the original before it counts.`,
    vals: { pid: p.id, pick: code && mineEligible(code) ? code : "", vstat: "Pending", cats: [], rq: "" }, lockPerson: true,
    body: () => {
      resolvePick();
      const v = S.ui.dlg.vals, c = CAT[v.code];
      let h = fld("pick", "Course or card", "item", sel("pick", [["", "Choose…"], ...opts], "", 'data-rr="1"'), { req: true });
      if (!c) return h;
      const calc = calcExpiry(v.code, v.achieved);
      h += `<div class="grid2">${fld("achieved", "Issue date", "achieved", inp("achieved", "date", "", `max="${TODAY_ISO}" data-rr="1"`), { req: true })}
        ${c.val === "never" ? fld("expx", "Expiry date", "expiry", `<div class="calc">Doesn't expire</div>`) : needsPrinted(v.code) ? fld("expiry", "Expiry date", "expiry", inp("expiry", "date"), { req: true, hint: "As printed on the card" }) : fld("expx", "Expiry date", "expiry", `<div class="calc">${calc ? uk(calc) : "Worked out from the issue date"}</div>`, { hint: esc(valText(v.code)) })}
        ${fld("certNo", c.type === "CARD" ? "Card number" : "Certificate number", "certNo", inp("certNo", "text", "", `placeholder="${esc(certExample(v.code))}"`), { req: c.type === "CARD" })}
        ${c.type === "TRAIN" ? fld("provider", "Training provider", "provider", inp("provider", "text", "", 'list="dl-prov" placeholder="Start typing…"')) : "<div></div>"}</div>
        <label class="drop" for="file"><input type="file" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png" data-rr="1"><b>${v.file ? esc(v.file) : "Choose a PDF or photo of the certificate"}</b><span>${v.file ? "Click to change" : "In this demo the file isn't uploaded"}</span></label>`;
      return h + datalists();
    },
    label: "Send for verification",
    save: () => saveRecordForm(),
  });
}
Object.assign(ACT, {
  viewcert: (d) => dlgCert(d.rid),
  minecert: (d) => dlgMine(d.code),
});

/* ===== "View as" switch in the suite's top bar ===== */
const VIEWS = [["ak", "register owner"], ["hw", "manager"], ["cb", "supervisor"], ["jh", "operative"]];
const viewAsOptions = (cur) => VIEWS.map(([id, what]) => `<option value="${id}"${id === cur ? " selected" : ""}>${esc(Suite.person(id).name)} (${what})</option>`).join("");
const curView = () => S.viewer || MANAGER_IDS.find((id) => Suite.person(id).name === S.user) || MANAGER_IDS[0];
/* On a phone the top bar has no room for the switch, so the same switch is shown at the top of the page instead */
function viewAsMobile() { return `<div class="viewas-m"><label for="viewAsM">View as</label><select id="viewAsM" class="sel">${viewAsOptions(curView())}</select></div>`; }
document.addEventListener("change", (ev) => { if (ev.target.id === "viewAsM") setViewer(ev.target.value); });
function setViewer(id) {
  const sp = Suite.person(id); if (!sp) return;
  const top = document.getElementById("viewAs"); if (top) top.value = id;
  S.viewer = MANAGER_IDS.includes(id) ? null : id;
  S.user = S.viewer && P(id) ? P(id).name : sp.name;
  S.ui.panel = []; S.ui.dlg = null; closeHelp();
  const a = ax(); a.sel.clear(); a.open = null; a.mode = null;
  render();
  window.scrollTo(0, 0);
}
function mountViewAs() {
  const slot = document.getElementById("suite-slot"); if (!slot) return;
  slot.innerHTML = `<label>View as <select id="viewAs">${viewAsOptions(curView())}</select></label>`;
  document.getElementById("viewAs").addEventListener("change", (ev) => setViewer(ev.target.value));
}

/* ===== Keep the demo's changes in this browser for the rest of the day, so moving between tools doesn't lose them.
   The suite's "Reset demo" clears it. A saved copy from an earlier day is ignored so the dates stay believable. ===== */
const STATE_V = "1";
function saveDemo() { Suite.save("training", STATE_V, { day: TODAY_ISO, people: S.people, records: S.records, reqs: S.reqs, bookings: S.bookings, reviews: S.reviews, log: S.log, seq: S.seq, cat: CAT, equiv: EQUIV }); }
function loadDemo() {
  try {
    const j = Suite.load("training", STATE_V);
    if (!j || j.day !== TODAY_ISO || !Array.isArray(j.records) || !Array.isArray(j.people) || !j.cat) return;
    Object.assign(S, { people: j.people, records: j.records, reqs: j.reqs, bookings: j.bookings, reviews: j.reviews, log: j.log, seq: j.seq });
    Object.keys(CAT).forEach((k) => delete CAT[k]); Object.assign(CAT, j.cat);
    Object.keys(EQUIV).forEach((k) => delete EQUIV[k]); Object.assign(EQUIV, j.equiv || {});
  } catch (e) {}
}
const _render = render;
render = function () {
  _render();
  document.querySelectorAll("#app tr[data-act], #app td[data-act]").forEach((el) => { if (!el.hasAttribute("tabindex")) el.tabIndex = 0; });
  saveDemo();
};
document.addEventListener("click", (ev) => { if (ev.target === document.body && document.body.classList.contains("has-panel") && !S.ui.dlg) { S.ui.panel = []; render(); } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (!S.viewer && TABS.some((x) => x[0] === h) && h !== S.ui.tab) { S.ui.tab = h; S.ui.panel = []; render(); } });
function boot() {
  const h = location.hash.slice(1); if (TABS.some((x) => x[0] === h)) S.ui.tab = h;
  mountViewAs();
  render();
  Suite.onChange(() => { if (!S.ui.dlg) render(); });
}
loadDemo();
boot();

</script>
</body>
</html>
